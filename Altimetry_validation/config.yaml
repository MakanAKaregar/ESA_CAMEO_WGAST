project_root: .

data:
  sentinel-6: data/raw/sentinel6
  sentinel-3: data/raw/sentinel3
  river_mask: data/river_mask
  stations: data/stations
  sword: data/sword
outputs:
  csv: outputs/csv
  figures: outputs/figures
  
processing:

  search_radius_deg = 0.12        # initial window around the station (~11 km approximately)
  buffer_radius_km = 1            # aggregation around the virtual point
  buffer_radius_m = int(buffer_radius_km * 1000)
  misfit_threshold = 6.0
  min_points_after_quality = 3
  weights: station: 0.7 center: 0.3
