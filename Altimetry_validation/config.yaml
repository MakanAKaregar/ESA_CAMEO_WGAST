project_root: .

sentinel:
  s3: data/raw/sentinel-3
  s6: data/raw/sentinel-6

outputs:
  csv: outputs/csv
  
processing:
search_radius_deg = 0.12        # initial window around the station (~11 km approximately)
buffer_radius_km = 1            # aggregation around the virtual point
buffer_radius_m = int(buffer_radius_km * 1000)
misfit_threshold = 6.0
min_points_after_quality = 3

weights:
  station: 0.7
  center: 0.3
